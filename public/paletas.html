<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Escolha de paleta · Viva La Vida</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#e8e5df;color:#233b33;font-family:system-ui,sans-serif}header{padding:24px;max-width:1080px;margin:auto}h1{font-size:24px;letter-spacing:-1px;margin:0 0 8px}p{font-size:14px;line-height:1.6;margin:0 0 18px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}button{border:1px solid #233b3340;border-radius:12px;min-height:76px;padding:12px;text-align:left;font:inherit;cursor:pointer;color:inherit}button[aria-pressed=true]{outline:2px solid #233b33;outline-offset:2px}button strong,button small{display:block}button strong{font-size:13px}button small{font-size:11px;margin-top:6px}a{color:inherit;display:inline-flex;align-items:center;min-height:44px;font-size:13px}:focus-visible{outline:3px solid #648034;outline-offset:4px}.preview{margin:0 auto 30px;width:min(100%,430px);height:760px;border:1px solid #233b3325;border-radius:20px;overflow:hidden;background:#f7f7ef;box-shadow:0 10px 40px #233b3310}iframe{display:block;width:100%;height:100%;border:0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:8px}.toolbar span{font-size:12px}@media(max-width:600px){header{padding:20px 16px}.choices{grid-template-columns:1fr 1fr}.preview{width:100%;border-radius:0;height:75svh;min-height:450px}.toolbar span{max-width:150px}}
  </style>
</head>
<body>
  <header>
    <h1>Qual clima combina com a Viva La Vida?</h1>
    <p>Compare as cores no site de verdade. O azul profundo é a paleta escolhida para o site: náutica e envolvente.</p>
    <div class="choices" aria-label="Opções de paleta">
      <button data-palette="areia" aria-pressed="false" style="background:#e8dbc8;color:#343d30"><strong>Areia quente</strong><small>#E8DBC8 · solar e acolhedora</small></button>
      <button data-palette="salvia" aria-pressed="false" style="background:#d8dfcf;color:#243c31"><strong>Verde sálvia</strong><small>#D8DFCF · natural e tranquila</small></button>
      <button data-palette="azul" aria-pressed="true" style="background:#142e38;color:#f1e8d8"><strong>Azul profundo · escolhida</strong><small>#142E38 · náutica e envolvente</small></button>
      <button data-palette="original" aria-pressed="false" style="background:#f7f7ef"><strong>Original</strong><small>#F7F7EF · para comparar</small></button>
    </div>
    <div class="toolbar"><span id="status" role="status">Prévia: azul profundo</span><a id="open" href="/?paleta=azul" target="_blank" rel="noopener">Abrir site nesta cor ↗</a></div>
  </header>
  <div class="preview"><iframe title="Prévia móvel do site Viva La Vida" src="/?paleta=azul"></iframe></div>
  <script>
    const frame=document.querySelector('iframe');
    document.querySelectorAll('button[data-palette]').forEach(button=>button.addEventListener('click',()=>{
      const palette=button.dataset.palette;
      document.querySelectorAll('button[data-palette]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
      document.querySelector('#open').href=palette?'/?paleta='+palette:'/';
      document.querySelector('#status').textContent='Prévia: '+button.querySelector('strong').textContent;
      if(frame.contentDocument) { if(palette)frame.contentDocument.documentElement.dataset.palette=palette;else delete frame.contentDocument.documentElement.dataset.palette; }
    }));
  </script>
</body>
</html>
