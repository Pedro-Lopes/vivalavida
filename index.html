<!doctype html>
<html lang="pt-BR" data-palette="azul">

    <!-- TODO: Substituir favicon.svg pelo logotipo real -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO -->
    <title>Viva La Vida | Passeios de Lancha no Rio de Janeiro e Niterói</title>
    <meta

      content="Passeios de lancha entre o Rio de Janeiro e Niterói, com roteiros personalizados, paisagens inesquecíveis e experiências para compartilhar."

    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Viva La Vida | Passeios de Lancha no Rio de Janeiro e Niterói" />

      content="Passeios de lancha entre o Rio de Janeiro e Niterói, com roteiros personalizados, paisagens inesquecíveis e experiências para compartilhar."

    <meta property="og:url" content="https://pedro-lopes.github.io/vivalavida/" />

    <meta property="og:image" content="https://pedro-lopes.github.io/vivalavida/images/rio-1600.webp" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Viva La Vida | Passeios de Lancha no Rio de Janeiro e Niterói" />

      name="twitter:description"
      content="Passeios de lancha entre o Rio de Janeiro e Niterói, com roteiros personalizados."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "TouristAttraction",
        "name": "Viva La Vida",
        "description": "Passeios de lancha entre o Rio de Janeiro e Niterói com roteiros personalizados.",

        "areaServed": [
          { "@type": "City", "name": "Rio de Janeiro" },
          { "@type": "City", "name": "Niterói" }
        ]
      }

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
